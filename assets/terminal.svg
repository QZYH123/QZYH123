<svg xmlns="http://www.w3.org/2000/svg" width="860" height="580" viewBox="0 0 860 580" role="img" aria-labelledby="t d">
<title id="t">Yanagi — terminal-style profile header</title>
<desc id="d">A Gruvbox-themed terminal window. Prompt runs figlet yanagi and prints the name in pixel letters, then neofetch shows an about panel (name Yanagi, role student, now OrbCue, mail yanagil233@gmail.com; short Chinese and English intro) and a stack panel listing Rust, Python, TypeScript and JavaScript with rough relative-usage bars, and Node.js as runtime.</desc>
<defs><linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="32" y1="0" x2="382" y2="0"><stop offset="0" stop-color="#fabd2f"/><stop offset="1" stop-color="#fe8019"/></linearGradient></defs>
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', 'Noto Sans Mono CJK SC', 'PingFang SC', 'Microsoft YaHei', monospace; font-size: 14px; }
  .fade { animation: fade .35s ease-out both; }
  .d1 { animation-delay: 1.5s; } .d2 { animation-delay: 1.9s; } .d3 { animation-delay: 2.3s; } .d4 { animation-delay: 2.7s; }
  .type { animation: type 1.1s steps(13, end) .3s both; }
  .cursor { animation: blink 1.06s steps(1, end) infinite; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  
  @media (prefers-reduced-motion: reduce) { .fade, .type, .cursor { animation: none; } }
</style>
